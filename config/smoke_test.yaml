run_name: smoke_test

# Dataset & loader
dataset: Cora
data_root: ./data

# Model hyper-parameters
model:
  hidden: 64
  num_layers: 2
  num_classes: 7
  heads: 4

solver:
  flop_budget: 0.2   # keep 20 % edges
  q_err_budget: 0.02

# Optimisation
optim:
  lr: 0.005
  weight_decay: 5e-4
  epochs: 2
  log_every: 1
