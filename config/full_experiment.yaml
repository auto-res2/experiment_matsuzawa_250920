    quantized: false          # source baseline FP16
  - name: resnet26d
    quantized: true           # source baseline INT8
  - name: convnext_tiny
    quantized: true
  - name: vit_tiny_patch16_224
    quantized: true
  - name: mobilevit_xs
    quantized: true