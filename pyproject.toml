[project]
name = "hawq_skim_zero_sketch"
version = "0.1.0"
description = "Refactored Zero-Sketch demo extracted from HAWQ-Skim experiment code."
authors = [
  { name = "Researcher", email = "research@example.com" }
]
requires-python = ">=3.10"
readme = "README.md"

# -----------------------------------------------------------------------------
# Core runtime dependencies (installed automatically by the package manager)
# -----------------------------------------------------------------------------
dependencies = [
  "torch>=1.9.0",
  "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
main = []
