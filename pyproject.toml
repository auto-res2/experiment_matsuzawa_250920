[project]
name = "eco_gat_refactor"
version = "0.1.0"
description = "Refactored ECO-GAT experiment into a structured, multi-file project"
authors = ["ML Researcher <researcher@example.com>"]
readme = "README.md"
requires-python = ">=3.9"
# Core scientific stack & PyG (CUDA-enabled wheels are resolved by pip based on platform tags)
dependencies = [
    "torch>=2.1.0",
    "torch-geometric>=2.4.0",
    "torch-scatter>=2.1.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
