[project]
name = "eco_gat"
version = "0.1.0"
description = "ECO-GAT research prototype – energy-constrained sparse + quantised GAT"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0.2",
    "scipy>=1.13.1",
    "torch>=2.8.0",
    "torch-geometric>=2.6.1",
]

[build-system]
requires = ["setuptools", "wheel"]

[tool.pdm]
dependencies = [
    "torch>=2.1.0",
    "torch-geometric>=2.4.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0"
]
