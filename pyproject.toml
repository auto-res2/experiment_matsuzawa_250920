[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerosketch-experiment"
version = "0.1.0"
description = "Refactored ZeroSketch experiment (smoke/full)"
readme = "README.md"
requires-python = ">=3.10"

# Strict list to keep the runtime lean and deterministic.
# PyYAML is needed for config parsing; torch for the sketch itself.
dependencies = [
  "torch>=1.9.0",
  "PyYAML>=6.0",
]