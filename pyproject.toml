[project]
name = "hawq_skim"
version = "0.1.1"
description = "Refactored experimental code for HAWQ-Skim graph sampler – minimal runnable pipeline"
requires-python = ">=3.10"

# ---------------------------------------------------------------------------
# Dependencies --------------------------------------------------------------
# ---------------------------------------------------------------------------
dependencies = [
  "pyyaml>=6.0",
  "torch>=1.13.0",
  "numpy>=1.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"