[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casp_experiments"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
  "torch==2.1.0",
  "torchvision==0.16.0",
  "torchaudio==2.1.0",
  "timm>=0.9.12",
  "datasets>=2.15.0",
  "huggingface_hub>=0.17.3",
  "numpy>=1.23.5,<2.0.0",
  "pandas>=2.1.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "scikit-learn>=1.3.0",
  "tqdm>=4.66.1",
  "pyyaml>=6.0.1",
  "ptflops>=0.7.2",
  "pynvml>=11.5.0",
  "wandb>=0.15.11",
  "psutil>=5.9.8"
]

[tool.setuptools.packages.find]
where = ["src"]
